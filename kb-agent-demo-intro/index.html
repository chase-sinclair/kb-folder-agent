<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>KB Agent Demo Intro</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600&family=Space+Grotesk:wght@500;700&display=block"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #06101d;
        --bg-mid: #0c1e33;
        --folder: #f0b44c;
        --folder-hi: #ffd483;
        --accent: #6ee7f5;
        --paper: #e7eef7;
        --paper-line: rgba(12, 30, 51, 0.18);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 38%, rgba(110, 231, 245, 0.18), transparent 28%),
          radial-gradient(circle at 18% 20%, rgba(255, 212, 131, 0.12), transparent 20%),
          linear-gradient(180deg, #081526 0%, var(--bg) 100%);
        font-family: "Inter Tight", sans-serif;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      .grid-glow,
      .grid-lines,
      .halo {
        position: absolute;
        inset: 0;
      }

      .grid-lines {
        background-image:
          linear-gradient(rgba(110, 231, 245, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(110, 231, 245, 0.05) 1px, transparent 1px);
        background-size: 72px 72px;
        mask-image: radial-gradient(circle at center, black 38%, transparent 90%);
        opacity: 0.55;
      }

      .grid-glow {
        background:
          radial-gradient(circle at 50% 45%, rgba(110, 231, 245, 0.14), transparent 30%),
          radial-gradient(circle at 50% 62%, rgba(240, 180, 76, 0.12), transparent 18%);
        filter: blur(26px);
      }

      .scene-content {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 88px 120px;
      }

      .file-layer {
        position: absolute;
        inset: 0;
      }

      .file-card {
        position: absolute;
        left: calc(960px + (var(--tx) * 1px));
        top: calc(550px + (var(--ty) * 1px));
        width: 178px;
        height: 116px;
        border-radius: 18px;
        padding: 16px 16px 12px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(231, 238, 247, 0.94));
        border: 1px solid rgba(255, 255, 255, 0.65);
        box-shadow:
          0 18px 32px rgba(0, 0, 0, 0.22),
          0 0 0 1px rgba(110, 231, 245, 0.08);
        transform-origin: center center;
        opacity: 1;
      }

      .file-card::before {
        content: "";
        display: block;
        width: 52px;
        height: 10px;
        border-radius: 999px;
        background: rgba(12, 30, 51, 0.12);
        margin-bottom: 14px;
      }

      .file-card::after {
        content: "";
        position: absolute;
        left: 16px;
        right: 16px;
        top: 44px;
        height: 48px;
        border-radius: 12px;
        background:
          linear-gradient(
            180deg,
            var(--paper-line) 0 8%,
            transparent 8% 28%,
            var(--paper-line) 28% 36%,
            transparent 36% 56%,
            var(--paper-line) 56% 64%,
            transparent 64% 84%,
            var(--paper-line) 84% 92%,
            transparent 92% 100%
          );
      }

      .file-card.accent {
        background:
          linear-gradient(180deg, rgba(110, 231, 245, 0.9), rgba(217, 251, 255, 0.98));
      }

      .folder-wrap {
        position: absolute;
        left: 655px;
        top: 432px;
        width: 610px;
        height: 390px;
        z-index: 4;
      }

      .folder-shadow {
        position: absolute;
        left: 65px;
        right: 65px;
        bottom: 14px;
        height: 54px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.32);
        filter: blur(20px);
      }

      .folder-body {
        position: absolute;
        inset: 92px 0 0;
        border-radius: 34px;
        background:
          linear-gradient(180deg, var(--folder-hi) 0%, #f6bf61 24%, var(--folder) 100%);
        border: 1px solid rgba(255, 231, 184, 0.64);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.45),
          0 30px 54px rgba(0, 0, 0, 0.26),
          0 0 46px rgba(110, 231, 245, 0.1);
      }

      .folder-pocket {
        position: absolute;
        left: 42px;
        right: 42px;
        top: 144px;
        bottom: 42px;
        border-radius: 26px;
        background:
          linear-gradient(180deg, rgba(138, 92, 18, 0.3), rgba(86, 56, 9, 0.12));
        overflow: hidden;
      }

      .folder-pocket::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.16), transparent 26%),
          linear-gradient(90deg, rgba(255, 255, 255, 0.09), transparent 20%, transparent 80%, rgba(0, 0, 0, 0.08));
        mix-blend-mode: screen;
      }

      .folder-tab {
        position: absolute;
        top: 48px;
        left: 46px;
        width: 220px;
        height: 82px;
        border-radius: 26px 26px 12px 12px;
        background:
          linear-gradient(180deg, #ffd78d 0%, #f5bf5f 100%);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.55),
          0 12px 22px rgba(0, 0, 0, 0.14);
      }

      .folder-lid {
        position: absolute;
        left: 12px;
        right: 12px;
        top: 78px;
        height: 118px;
        border-radius: 28px 28px 20px 20px;
        background:
          linear-gradient(180deg, #ffd483 0%, #f5bf5f 55%, #eca83a 100%);
        border: 1px solid rgba(255, 240, 209, 0.58);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.45),
          0 20px 34px rgba(0, 0, 0, 0.16);
        transform-origin: 50% 100%;
      }

      .folder-rim {
        position: absolute;
        left: 34px;
        right: 34px;
        top: 128px;
        height: 16px;
        border-radius: 999px;
        background: rgba(132, 84, 14, 0.22);
        filter: blur(2px);
      }

      .cursor {
        position: absolute;
        left: 1210px;
        top: 330px;
        width: 72px;
        height: 100px;
        z-index: 6;
        filter: drop-shadow(0 14px 18px rgba(0, 0, 0, 0.24));
      }

      .cursor svg {
        width: 100%;
        height: 100%;
      }

      .click-ring {
        position: absolute;
        left: 1148px;
        top: 446px;
        width: 132px;
        height: 132px;
        border-radius: 50%;
        border: 3px solid rgba(110, 231, 245, 0.72);
        z-index: 5;
        opacity: 0;
      }

      .micro-glow {
        position: absolute;
        left: 905px;
        top: 468px;
        width: 160px;
        height: 160px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(110, 231, 245, 0.34), transparent 68%);
        filter: blur(20px);
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <div class="grid-glow"></div>
      <div class="grid-lines"></div>
      <div class="scene-content">
        <div class="micro-glow"></div>
        <div class="file-layer">
          <div class="file-card" style="--tx:-540; --ty:-242; --rot:-11;"></div>
          <div class="file-card accent" style="--tx:-394; --ty:-272; --rot:-7;"></div>
          <div class="file-card" style="--tx:-240; --ty:-292; --rot:-4;"></div>
          <div class="file-card" style="--tx:-78; --ty:-304; --rot:-2;"></div>
          <div class="file-card accent" style="--tx:90; --ty:-296; --rot:3;"></div>
          <div class="file-card" style="--tx:252; --ty:-284; --rot:5;"></div>
          <div class="file-card" style="--tx:414; --ty:-256; --rot:8;"></div>
          <div class="file-card" style="--tx:542; --ty:-214; --rot:12;"></div>

          <div class="file-card" style="--tx:-602; --ty:-58; --rot:-10;"></div>
          <div class="file-card" style="--tx:-446; --ty:-86; --rot:-6;"></div>
          <div class="file-card accent" style="--tx:-278; --ty:-104; --rot:-4;"></div>
          <div class="file-card" style="--tx:-106; --ty:-118; --rot:-1;"></div>
          <div class="file-card" style="--tx:66; --ty:-116; --rot:2;"></div>
          <div class="file-card accent" style="--tx:238; --ty:-102; --rot:4;"></div>
          <div class="file-card" style="--tx:404; --ty:-74; --rot:7;"></div>
          <div class="file-card" style="--tx:564; --ty:-36; --rot:10;"></div>

          <div class="file-card accent" style="--tx:-548; --ty:126; --rot:-8;"></div>
          <div class="file-card" style="--tx:-388; --ty:102; --rot:-5;"></div>
          <div class="file-card" style="--tx:-218; --ty:88; --rot:-3;"></div>
          <div class="file-card" style="--tx:-50; --ty:78; --rot:-1;"></div>
          <div class="file-card accent" style="--tx:122; --ty:80; --rot:2;"></div>
          <div class="file-card" style="--tx:292; --ty:92; --rot:4;"></div>
          <div class="file-card" style="--tx:456; --ty:118; --rot:7;"></div>
          <div class="file-card accent" style="--tx:610; --ty:154; --rot:11;"></div>
        </div>

        <div class="folder-wrap">
          <div class="folder-shadow"></div>
          <div class="folder-body"></div>
          <div class="folder-tab"></div>
          <div class="folder-pocket"></div>
          <div class="folder-rim"></div>
          <div class="folder-lid"></div>
        </div>

        <div class="click-ring"></div>
        <div class="cursor" aria-hidden="true">
          <svg viewBox="0 0 72 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M9 5L58 63L35 66L44 94L28 100L19 71L2 84L9 5Z"
              fill="white"
            />
            <path
              d="M9 5L58 63L35 66L44 94L28 100L19 71L2 84L9 5Z"
              stroke="#06101D"
              stroke-width="4"
              stroke-linejoin="round"
            />
          </svg>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from(".folder-wrap", {
        y: 26,
        scale: 0.94,
        opacity: 0,
        duration: 0.72,
        ease: "power3.out",
      }, 0.16);
      tl.from(".grid-lines", {
        opacity: 0,
        duration: 0.9,
        ease: "sine.out",
      }, 0.2);
      tl.from(".micro-glow", {
        scale: 0.35,
        opacity: 0,
        duration: 0.7,
        ease: "expo.out",
      }, 0.28);
      tl.from(".cursor", {
        x: 220,
        y: -140,
        rotate: 8,
        opacity: 0,
        duration: 0.75,
        ease: "power2.out",
      }, 0.82);
      tl.to(".cursor", {
        x: -148,
        y: 114,
        duration: 0.56,
        ease: "power2.inOut",
      }, 1.58);
      tl.to(".cursor", {
        scale: 0.92,
        duration: 0.12,
        ease: "power2.out",
        yoyo: true,
        repeat: 1,
      }, 2.02);
      tl.fromTo(".click-ring", {
        scale: 0.2,
        opacity: 0.95,
      }, {
        scale: 1.7,
        opacity: 0,
        duration: 0.46,
        ease: "power2.out",
      }, 2.02);
      tl.to(".folder-lid", {
        rotationX: 58,
        y: -24,
        duration: 0.42,
        ease: "back.out(1.15)",
      }, 2.08);
      tl.to(".folder-tab", {
        y: -10,
        duration: 0.32,
        ease: "power2.out",
      }, 2.1);
      tl.to(".folder-rim", {
        opacity: 0.45,
        duration: 0.28,
        ease: "sine.out",
      }, 2.12);
      tl.from(".file-card", {
        y: 86,
        scale: 0.78,
        opacity: 0,
        stagger: 0.035,
        duration: 0.42,
        ease: "expo.out",
      }, 2.2);
      tl.to(".file-layer", {
        y: -10,
        duration: 0.9,
        ease: "sine.inOut",
        yoyo: true,
        repeat: 1,
      }, 3.0);
      tl.to(".cursor", {
        x: 64,
        y: -74,
        opacity: 0,
        duration: 0.5,
        ease: "power2.in",
      }, 3.35);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
